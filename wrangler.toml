name = "my-flower-pots-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
keep_vars = true

# Production vars are managed in the Cloudflare dashboard / secrets.
# `keep_vars = true` prevents `wrangler deploy` from overwriting them.

[dev]
port = 8787
ip = "127.0.0.1"
local_protocol = "http"

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/",
  "/index",
  "/index.html",
  "/about",
  "/about.html",
  "/add-pot",
  "/add-pot.html",
  "/admin-inbox",
  "/admin-inbox.html",
  "/admin-plants",
  "/admin-plants.html",
  "/admin-stats",
  "/admin-stats.html",
  "/admin-users",
  "/admin-users.html",
  "/admin-cache",
  "/admin-cache.html",
  "/all-records",
  "/all-records.html",
  "/all-timelines",
  "/all-timelines.html",
  "/care-record",
  "/care-record.html",
  "/collaborative-plant-care",
  "/collaborative-plant-care.html",
  "/edit-pot",
  "/edit-pot.html",
  "/error",
  "/error.html",
  "/growth-timeline",
  "/growth-timeline.html",
  "/help",
  "/help.html",
  "/pot-detail",
  "/pot-detail.html",
  "/plant-care-records",
  "/plant-care-records.html",
  "/privacy",
  "/privacy.html",
  "/profile",
  "/profile.html",
  "/public-plant-sharing",
  "/public-plant-sharing.html",
  "/robots.txt",
  "/reset-password",
  "/reset-password.html",
  "/sitemap.xml",
  "/watering-reminders",
  "/watering-reminders.html",
]

[[d1_databases]]
binding = "DB"
database_name = "my-flower-pots"
database_id = "8c06be0c-af0c-43fc-99fb-b15c69fe6d2f"
migrations_dir = "migrations"
migrations_table = "d1_migrations"

[[analytics_engine_datasets]]
binding = "PAGE_ANALYTICS"
dataset = "my_flower_pots_page_visits"

[[r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "my-flower-pots"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[placement]
mode = "smart"
