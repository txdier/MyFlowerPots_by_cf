<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>成长轨迹 - My Flower Pots</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        [v-cloak] {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="css/tailwind-built.css?v=20260227">
    <link rel="stylesheet" href="css/app.css?v=20260227">
    <link rel="stylesheet" href="css/icons.css">

    <style>
        [v-cloak] {
            display: none;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.2s ease-out;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="app" v-cloak>
        <header class="header bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-50 h-16 w-full">
            <div class="container relative flex items-center h-full">
                <div class="z-10">
                    <button class="inline-flex items-center justify-center text-gray-400 active:scale-90 transition"
                        @click="goBack">
                        <i class="fa fa-arrow-left text-xl"></i>
                    </button>
                </div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <h1 class="text-base sm:text-lg font-black text-gray-800">全部成长轨迹</h1>
                </div>
            </div>
        </header>

        <main class="container py-6">
            <div v-if="pot" class="bg-white rounded-2xl p-4 mb-6 flex items-center shadow-sm border border-gray-100">
                <img :src="imgUrl(pot.image_url, 48, 48) || 'assets/images/icons/icons-default-pot.png'"
                    class="w-12 h-12 rounded-lg object-cover mr-4" @error="handleImageError">
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-gray-800 truncate">{{ pot.name }}</h3>
                    <p class="text-[10px] text-gray-400 mt-0.5">共 {{ timelineRecords.length }} 条记录</p>
                </div>
                <!-- 排序控制按钮 -->
                <button @click="toggleTimelineSort"
                    class="bg-gray-100 text-gray-500 w-10 h-10 rounded-full flex items-center justify-center shadow-sm active:scale-95 transition">
                    <i class="fas" :class="isTimelineDesc ? 'fa-sort-amount-down' : 'fa-sort-amount-up'"></i>
                </button>
            </div>

            <div v-if="isLoading" class="py-20 text-center">
                <div class="spinner mx-auto mb-4"></div>
                <p class="text-gray-400 text-sm">正在加载成长记录...</p>
            </div>

            <div v-else-if="timelineRecords.length === 0" class="py-20 text-center">
                <div
                    class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                    <i class="fa fa-camera text-2xl"></i>
                </div>
                <p class="text-gray-400 text-sm">还没有留下它的成长瞬间</p>
            </div>

            <div v-else class="bg-white rounded-3xl shadow-sm border border-gray-50 p-6 space-y-6">
                <!-- 循环渲染所有照片轨迹 -->
                <div v-for="record in sortedTimelineRecords" :key="record.id"
                    class="relative pl-6 border-l-2 border-blue-50">
                    <div
                        class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-white border-4 border-blue-500 shadow-sm">
                    </div>

                    <div class="flex justify-between items-center mb-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-black text-gray-400">{{ formatDate(record.date) }}</span>
                            <span v-if="!isPublicSharePage && (record.operatorName || record.operator_name)" class="px-2 py-0.5 bg-gray-100 text-gray-400 text-[9px] font-bold rounded-md">
                                <i class="fa fa-user-edit mr-0.5"></i> {{ record.operatorName || record.operator_name }}
                            </span>
                        </div>
                        <div v-if="canManageTimelines" class="flex items-center gap-1">
                            <button @click="openEditTimelineModal(record)"
                                class="text-gray-300 hover:text-blue-500 p-1 active:scale-90 transition"
                                title="编辑成长轨迹">
                                <i class="fa fa-pen text-xs"></i>
                            </button>
                            <button @click="confirmDeleteTimeline(record.id)"
                                class="text-gray-300 hover:text-red-400 p-1 active:scale-90 transition"
                                title="删除成长轨迹">
                                <i class="fa fa-trash-alt text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-sm text-gray-700 mb-3 font-medium">{{ record.description || '这一天，有了新的成长...' }}</p>

                    <div v-if="getImages(record.images).length > 0" class="grid grid-cols-3 gap-2">
                        <div v-for="(img, idx) in getImages(record.images)" :key="idx"
                            class="aspect-square rounded-2xl overflow-hidden bg-gray-100 shadow-sm">
                            <img :src="imgUrl(img, 100, 100)" loading="lazy"
                                class="w-full h-full object-cover cursor-pointer active:opacity-75 transition"
                                @click="openGallery(img, getImages(record.images), imgUrl(img, 100, 100))">
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 编辑成长轨迹 -->
        <div v-if="showEditTimelineModal"
            class="fixed inset-0 z-[90] flex items-end sm:items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="closeEditTimelineModal"></div>
            <div
                class="relative bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl animate-fade-in flex flex-col max-h-[90vh]">
                <div class="px-6 sm:px-8 pt-8 pb-4 shrink-0">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-xl font-black text-gray-800">编辑成长轨迹</h3>
                            <p class="text-xs text-gray-400 mt-1">调整日期、文字和照片</p>
                        </div>
                        <button @click="closeEditTimelineModal"
                            class="text-gray-300 hover:text-gray-500 transition active:scale-95">
                            <i class="fa fa-times text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="px-6 sm:px-8 pb-8 overflow-y-auto flex-1">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">记录日期</label>
                            <input type="date" v-model="editTimelineForm.date"
                                class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 font-bold text-gray-800">
                        </div>
                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">文字说明</label>
                            <textarea v-model="editTimelineForm.description" rows="3" placeholder="写点什么，记录这一刻的喜悦..."
                                class="w-full bg-gray-50 border-none rounded-2xl py-4 px-6 font-bold text-gray-800 resize-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">照片
                                (多选, 最多9张)</label>
                            <div class="grid grid-cols-4 gap-2 mt-2">
                                <div v-for="(img, idx) in editTimelineForm.existingImages" :key="`existing-${idx}-${img}`"
                                    class="relative aspect-square bg-gray-100 rounded-xl overflow-hidden">
                                    <img :src="imgUrl(img, 100, 100)" class="w-full h-full object-cover">
                                    <button @click="removeExistingTimelineImage(idx)"
                                        class="absolute top-1 right-1 bg-black/50 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center">
                                        <i class="fa fa-times"></i>
                                    </button>
                                </div>
                                <div v-for="(img, idx) in editTimelineForm.tempImages" :key="`new-${idx}`"
                                    class="relative aspect-square bg-gray-100 rounded-xl overflow-hidden">
                                    <img :src="img.preview" class="w-full h-full object-cover">
                                    <button @click="removeNewImage(idx)"
                                        class="absolute top-1 right-1 bg-black/50 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center">
                                        <i class="fa fa-times"></i>
                                    </button>
                                </div>
                                <button v-if="editTimelineImageCount() < 9" @click="triggerFileInput"
                                    class="aspect-square border-2 border-dashed border-gray-200 rounded-xl flex flex-col items-center justify-center text-gray-300 hover:border-blue-500 hover:text-blue-500 transition active:scale-95">
                                    <i class="fa fa-camera text-xl mb-1"></i>
                                    <span class="text-[8px] font-black uppercase tracking-tighter">添加</span>
                                </button>
                            </div>
                            <input type="file" ref="fileInput" @change="onFilesSelected" multiple accept="image/*"
                                class="hidden">
                        </div>
                    </div>
                    <div class="mt-10">
                        <button @click="saveEditedTimeline" :disabled="isSavingTimeline"
                            class="w-full bg-blue-500 text-white py-4 rounded-2xl text-lg font-black shadow-xl shadow-blue-100 disabled:opacity-50 transition active:scale-[0.98]">
                            <span v-if="!isSavingTimeline">保存修改</span>
                            <span v-else><i class="fa fa-spinner fa-spin mr-2"></i>正在同步...</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图片全屏画廊 -->
        <div v-if="previewImages.length > 0"
            class="fixed inset-0 z-[100] bg-black flex items-center justify-center animate-fade-in touch-none"
            @click.self="closeGallery">
            <button @click="closeGallery"
                class="absolute top-6 right-6 text-white/50 hover:text-white p-4 z-[110] transition">
                <i class="fa fa-times text-2xl drop-shadow-md"></i>
            </button>
            <button v-if="previewImages.length > 1" @click.stop="prevImg"
                class="absolute left-2 top-1/2 -translate-y-1/2 p-4 text-white/50 hover:text-white z-[110] transition disabled:opacity-20"
                :disabled="previewIndex === 0">
                <i class="fa fa-chevron-left text-3xl drop-shadow-md"></i>
            </button>
            <button v-if="previewImages.length > 1" @click.stop="nextImg"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-4 text-white/50 hover:text-white z-[110] transition disabled:opacity-20"
                :disabled="previewIndex === previewImages.length - 1">
                <i class="fa fa-chevron-right text-3xl drop-shadow-md"></i>
            </button>

            <!-- 卡带式图片轨道 -->
            <div class="absolute inset-0 overflow-hidden">
                <div class="flex h-full items-center transition-transform" :style="{
                        transform: `translateX(${-previewIndex * 100}%)`,
                        transition: 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)'
                    }">
                    <div v-for="(item, idx) in previewImages" :key="item.fullSrc || idx"
                        class="w-full h-full flex-shrink-0 flex items-center justify-center px-4" @click="closeGallery">
                        <img v-if="item.isFullLoaded" :src="item.displaySrc" loading="lazy"
                            class="max-w-full max-h-full object-contain select-none transition duration-300"
                            draggable="false">
                        <div v-else class="flex flex-col items-center justify-center gap-3 text-white/60">
                            <div v-if="item.isFullLoadFailed" class="text-center">
                                <i class="fa fa-exclamation-circle text-2xl mb-2"></i>
                                <div class="text-xs font-bold">图片加载失败</div>
                            </div>
                            <template v-else>
                                <div class="spinner"></div>
                                <div class="text-xs font-bold tracking-widest">加载原图中...</div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部：计数 + 小圆点 -->
            <div class="absolute bottom-10 left-0 right-0 flex flex-col items-center gap-3 pointer-events-none">
                <div v-if="previewImages.length > 1" class="flex gap-1.5">
                    <span v-for="(_, idx) in previewImages" :key="idx"
                        class="w-1.5 h-1.5 rounded-full transition-all duration-300"
                        :class="idx === previewIndex ? 'bg-white w-4' : 'bg-white/40'">
                    </span>
                </div>
                <span class="text-white/60 text-xs font-bold tracking-widest">
                    {{ previewIndex + 1 }} / {{ previewImages.length }}
                </span>
            </div>
        </div>
    </div>

    <script src="js/vue.global.js"></script>
    <script src="js/config.js?v=20260111"></script>
    <script src="js/api-client.js?v=20260422-share-access"></script>
    <script src="js/media-utils.js?v=20260421-refactor"></script>
    <script src="js/pot-permissions.js?v=20260421-refactor"></script>
    <script src="js/gallery-utils.js?v=20260421-refactor"></script>
    <script src="js/timeline-utils.js?v=20260421-refactor"></script>
    <script src="js/date-utils.js?v=20260428-growth"></script>
    <script src="js/dialog-utils.js?v=20260421-refactor"></script>

    <script>
        const { createApp, ref, reactive, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const nav = window.MyFlowerPotsNavigation;
                const showAlert = window.MyFlowerPotsDialog.alert;
                const showConfirm = window.MyFlowerPotsDialog.confirm;
                    const isLoading = ref(true);
                    const potId = ref(null);
                    const shareToken = ref(null);
                    const isPublicSharePage = computed(() => !!shareToken.value);
                    const pot = ref(null);
                const timelineRecords = ref([]);
                const isTimelineDesc = ref(true);
                const showEditTimelineModal = ref(false);
                const isSavingTimeline = ref(false);
                const fileInput = ref(null);
                const editTimelineForm = reactive({
                    id: null,
                    date: '',
                    description: '',
                    existingImages: [],
                    tempImages: []
                });

                const previewImages = ref([]);
                const previewIndex = ref(0);
                const galleryImageLoadToken = ref(0);
                const canManageTimelines = computed(() =>
                    MyFlowerPotsPotPermissions.canManageRecords(pot.value, apiClient.userId)
                );

                    const buildCurrentPageUrl = () => {
                        const params = new URLSearchParams();
                        if (potId.value) params.set('potId', potId.value);
                        if (shareToken.value) params.set('token', shareToken.value);
                        const query = params.toString();
                        return query ? `all-timelines?${query}` : 'all-timelines';
                    };

                    const buildDetailPageUrl = () => {
                        const params = new URLSearchParams();
                        if (shareToken.value) {
                            params.set('token', shareToken.value);
                        } else if (potId.value) {
                            params.set('id', potId.value);
                        }
                        const query = params.toString();
                        return query ? `pot-detail?${query}` : 'pot-detail';
                    };

                    const init = async () => {
                        const params = new URLSearchParams(window.location.search);
                        potId.value = params.get('potId');
                        shareToken.value = params.get('token');

                        if (!potId.value && !shareToken.value) {
                            nav.redirectToError({
                                type: 'not_found',
                                from: 'all-timelines',
                            redirect: '/',
                            message: '缺少花盆参数，无法加载成长轨迹。'
                        }, { replace: true });
                        return;
                    }

                        try {
                            if (shareToken.value) {
                                await loadPublicTimelinePage();
                            } else {
                                await Promise.all([
                                    loadPotInfo(),
                                    loadTimelineRecords()
                                ]);
                            }
                        } catch (e) {
                            console.error(e);
                            nav.redirectForApiError(e, {
                                from: 'all-timelines',
                                redirect: buildCurrentPageUrl(),
                                authType: 'login_required',
                            forbiddenType: 'forbidden',
                            notFoundType: 'not_found',
                            message: e.message || '成长轨迹暂时无法加载。'
                        }, { replace: true });
                    } finally {
                        isLoading.value = false;
                    }
                };

                    const loadPotInfo = async () => {
                        const res = await apiClient.getPotDetail(potId.value);
                        if (res.success) pot.value = res.data;
                    };

                    const loadTimelineRecords = async () => {
                        const res = await apiClient.getTimelines(potId.value);
                        if (res.success) timelineRecords.value = res.data || [];
                    };

                    const loadPublicTimelinePage = async () => {
                        const res = await apiClient.getPublicPotDetail(shareToken.value, {
                            careLimit: 1,
                            timelineLimit: 'all'
                        });
                        if (res.success) {
                            const viewer = res.data.viewer || {};
                            pot.value = {
                                ...res.data.pot,
                                is_collaborator: !!viewer.isCollaborator,
                                is_viewer: !!viewer.isViewer
                            };
                            potId.value = pot.value?.id || potId.value;
                            timelineRecords.value = res.data.timelines || [];
                        }
                    };

                const sortedTimelineRecords = computed(() => {
                    return [...timelineRecords.value].sort((a, b) => {
                        const dateA = new Date(a.date);
                        const dateB = new Date(b.date);
                        return isTimelineDesc.value ? dateB - dateA : dateA - dateB;
                    });
                });

                const toggleTimelineSort = () => isTimelineDesc.value = !isTimelineDesc.value;

                const confirmDeleteTimeline = async (id) => {
                    if (!canManageTimelines.value) return;
                    if (showConfirm('确认删除这条生长记录？照片也将一并清理。')) {
                        try {
                            const res = await apiClient.deleteTimeline(id);
                            if (res.success) await loadTimelineRecords();
                        } catch (e) { showAlert('删除操作失败'); }
                    }
                };

                const editTimelineImageCount = () => editTimelineForm.existingImages.length + editTimelineForm.tempImages.length;

                const resetEditTimelineForm = () => {
                    editTimelineForm.id = null;
                    editTimelineForm.date = '';
                    editTimelineForm.description = '';
                    editTimelineForm.existingImages = [];
                    editTimelineForm.tempImages = [];
                };

                const openEditTimelineModal = (record) => {
                    if (!canManageTimelines.value) return;
                    editTimelineForm.id = record.id;
                    editTimelineForm.date = record.date || '';
                    editTimelineForm.description = record.description || '';
                    editTimelineForm.existingImages = getImages(record.images);
                    editTimelineForm.tempImages = [];
                    showEditTimelineModal.value = true;
                };

                const closeEditTimelineModal = () => {
                    if (isSavingTimeline.value) return;
                    showEditTimelineModal.value = false;
                    resetEditTimelineForm();
                };

                const triggerFileInput = () => fileInput.value?.click();

                const onFilesSelected = async (e) => {
                    const remaining = 9 - editTimelineImageCount();
                    const items = await MyFlowerPotsMedia.selectImages(e, { limit: remaining });
                    editTimelineForm.tempImages.push(...items);
                };

                const removeExistingTimelineImage = (idx) => editTimelineForm.existingImages.splice(idx, 1);
                const removeNewImage = (idx) => editTimelineForm.tempImages.splice(idx, 1);

                const saveEditedTimeline = async () => {
                    if (!canManageTimelines.value) return;
                    if (!editTimelineForm.id) return;
                    if (!editTimelineForm.date) {
                        showAlert('请选择记录日期');
                        return;
                    }
                    if (editTimelineImageCount() === 0 && !editTimelineForm.description?.trim()) {
                        showAlert('请至少保留一张照片或写点描述');
                        return;
                    }
                    try {
                        isSavingTimeline.value = true;
                        const saveRes = await MyFlowerPotsTimeline.saveTimelineForm(apiClient, {
                            potId: potId.value,
                            timelineId: editTimelineForm.id,
                            date: editTimelineForm.date,
                            description: editTimelineForm.description,
                            existingImages: editTimelineForm.existingImages,
                            tempImages: editTimelineForm.tempImages
                        });
                        if (saveRes.success) {
                            showEditTimelineModal.value = false;
                            resetEditTimelineForm();
                            await loadTimelineRecords();
                        }
                    } catch (e) {
                        showAlert('保存失败，请检查网络后重试');
                    } finally {
                        isSavingTimeline.value = false;
                    }
                };

                const {
                    preloadNearbyGalleryImages,
                    openGallery,
                    closeGallery,
                    prevImg,
                    nextImg
                } = MyFlowerPotsGallery.createGallery({
                    previewImages,
                    previewIndex,
                    loadToken: galleryImageLoadToken
                });

                watch(previewIndex, preloadNearbyGalleryImages);

                const getImages = MyFlowerPotsMedia.parseImageList;

                const imgUrl = MyFlowerPotsMedia.imgUrl;

                    const goBack = () => {
                        window.location.href = buildDetailPageUrl();
                    };

                const formatDate = MyFlowerPotsDate.formatIsoDate;

                const handleImageError = (e) => MyFlowerPotsMedia.setImageFallback(e);

                    window.addEventListener('auth:expired', (event) => {
                        nav.redirectToSessionExpired(event.detail?.message, {
                            from: 'all-timelines',
                            redirect: buildCurrentPageUrl(),
                            source: 'auth'
                    }, { replace: true });
                });

                onMounted(init);

                return {
                    isLoading, pot, isPublicSharePage, timelineRecords, sortedTimelineRecords, isTimelineDesc,
                    canManageTimelines, showEditTimelineModal, isSavingTimeline, editTimelineForm, fileInput,
                    previewImages, previewIndex,
                    toggleTimelineSort, confirmDeleteTimeline, openEditTimelineModal, closeEditTimelineModal,
                    triggerFileInput, onFilesSelected, removeExistingTimelineImage, removeNewImage,
                    editTimelineImageCount, saveEditedTimeline, openGallery, closeGallery, prevImg, nextImg,
                    getImages, imgUrl, goBack, formatDate, handleImageError
                };
            }
        }).mount('#app');
    </script>

</body>

</html>
