<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>所有记录 - My Flower Pots</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Vue 3 CDN -->
    <script src="js/vue.global.js"></script>

    <style>
        [v-cloak] {
            display: none !important;
        }
    </style>

    <!-- Tailwind CSS & Custom Styles (Optimized) -->
    <link rel="stylesheet" href="css/tailwind-built.css?v=20260407-1">
    <link rel="stylesheet" href="css/app.css?v=20260227">

    <!-- 图标库 -->
    <link rel="stylesheet" href="css/icons.css">

    <!-- 配置脚本 -->
    <script src="js/config.js?v=20260111"></script>
    <script src="js/api-client.js?v=20260422-share-access"></script>
    <script src="js/media-utils.js?v=20260421-refactor"></script>
    <script src="js/pot-permissions.js?v=20260421-refactor"></script>
    <script src="js/care-utils.js?v=20260421-refactor"></script>
    <script src="js/date-utils.js?v=20260422-date"></script>
    <script src="js/dialog-utils.js?v=20260421-refactor"></script>
</head>

<body class="bg-gray-50">
    <div id="app" v-cloak>
        <!-- 顶部导航栏 (全宽强制布局) -->
        <header class="header bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-50 h-16 w-full">
            <div class="container relative flex items-center h-full">
                <div class="z-10">
                    <button class="inline-flex items-center justify-center text-gray-400 active:scale-90 transition"
                        @click="goBack">
                        <i class="fa fa-arrow-left text-xl"></i>
                    </button>
                </div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <h1 class="text-base sm:text-lg font-black text-gray-800">养护记录</h1>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="container py-6">
            <!-- 花盆简要信息 -->
            <div v-if="pot" class="bg-white rounded-2xl p-4 mb-6 flex items-center shadow-sm border border-gray-100">
                <img :src="imgUrl(pot.image_url, 48, 48) || 'assets/images/icons/icons-default-pot.png'"
                    class="w-12 h-12 rounded-lg object-cover mr-4">
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-gray-800 truncate">{{ pot.name }}</h3>
                    <p class="text-[10px] text-gray-400 mt-0.5">共 {{ records.length }} 条记录</p>
                </div>
                <button v-if="canManageRecords" @click="goAddCare"
                    class="bg-green-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition">
                    <i class="fa fa-plus"></i>
                </button>
            </div>

            <!-- 类型过滤器 -->
            <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar">
                <button v-for="t in filterOptions" :key="t.value" @click="filterType = t.value"
                    :class="filterType === t.value ? 'bg-green-500 text-white shadow-md shadow-green-100' : 'bg-white text-gray-500 border-gray-100'"
                    class="shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition-all">
                    {{ t.label }}
                </button>
            </div>

            <!-- 记录列表 -->
            <div v-if="isLoading" class="py-20 text-center">
                <div class="spinner mx-auto mb-4"></div>
                <p class="text-gray-400 text-sm">正在加载养护记录...</p>
            </div>

            <div v-else-if="filteredRecords.length === 0" class="py-20 text-center">
                <p class="text-gray-400 text-sm">在此筛选条件下没有找到记录</p>
            </div>

            <div v-else class="space-y-4">
                <div v-for="record in filteredRecords" :key="record.id"
                    class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex gap-4 transition-all hover:shadow-md">
                    <!-- 左侧图标 -->
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0"
                        :class="getCareTypeColor(record.type, record.action)">
                        <i :class="getCareTypeIcon(record.type, record.action)" class="text-lg"></i>
                    </div>

                    <!-- 右侧内容 -->
                    <div class="flex-1 min-w-0 relative">
                        <div class="absolute top-0 right-0 text-[10px] font-bold text-gray-300">{{
                            formatDate(record.date) }}</div>
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            <span class="text-sm font-black text-gray-800">{{ getCareTypeLabel(record.type, record.action) }}</span>
                            <span v-if="record.operatorName"
                                class="px-2 py-0.5 bg-gray-100 text-gray-400 text-[9px] font-bold rounded-md">
                                <i class="fa fa-user-edit mr-0.5"></i> {{ record.operatorName }}
                            </span>
                        </div>
                        <p class="text-xs text-gray-500 leading-relaxed mb-3 line-clamp-2">
                            {{ record.description || '常规养护任务，确保植物健康生长。' }}
                        </p>

                        <!-- 记录中的图片 -->
                        <div v-if="record.imageUrl" class="mb-3">
                            <img :src="imgUrl(record.imageUrl, 80, 80)"
                                class="w-20 h-20 rounded-xl object-cover cursor-pointer hover:opacity-80 transition"
                                @click="previewImage(record.imageUrl)">
                        </div>

                        <!-- 操作按钮 -->
                        <div v-if="canManageRecords" class="flex justify-end gap-4 border-t border-gray-50 pt-3">
                            <button @click="editRecord(record)"
                                class="text-[11px] font-bold text-blue-500 flex items-center gap-1">
                                <i class="fa fa-edit"></i> 修改
                            </button>
                            <button @click="deleteRecord(record)"
                                class="text-[11px] font-bold text-red-400 flex items-center gap-1">
                                <i class="fa fa-trash-alt"></i> 删除
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 图片全屏预览 -->
        <div v-if="previewUrl"
            class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4 animate-fade-in"
            @click="previewUrl = null">
            <img :src="previewUrl" class="max-w-full max-h-full object-contain shadow-2xl">
            <div class="absolute top-6 right-6 text-white text-2xl"><i class="fa fa-times"></i></div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, onMounted, computed } = Vue;

        createApp({
            setup() {
                const nav = window.MyFlowerPotsNavigation;
                const showAlert = window.MyFlowerPotsDialog.alert;
                const showConfirm = window.MyFlowerPotsDialog.confirm;
                    const isLoading = ref(true);
                    const potId = ref(null);
                    const shareToken = ref(null);
                    const pot = ref(null);
                const records = ref([]);
                const filterType = ref('all');
                const previewUrl = ref(null);

                const filterOptions = [
                    { label: '全部记录', value: 'all' },
                    { label: '浇水', value: 'water' },
                    { label: '施肥', value: 'fertilize' },
                    { label: '修剪', value: 'prune' },
                    { label: '换盆', value: 'repot' },
                    { label: '除虫', value: 'pest' },
                    { label: '其他', value: 'other' }
                ];

                    const buildCurrentPageUrl = () => {
                        const params = new URLSearchParams();
                        if (potId.value) params.set('potId', potId.value);
                        if (shareToken.value) params.set('token', shareToken.value);
                        const query = params.toString();
                        return query ? `all-records?${query}` : 'all-records';
                    };

                    const buildDetailPageUrl = () => {
                        const params = new URLSearchParams();
                        if (shareToken.value) {
                            params.set('token', shareToken.value);
                        } else if (potId.value) {
                            params.set('id', potId.value);
                        }
                        const query = params.toString();
                        return query ? `pot-detail?${query}` : 'pot-detail';
                    };

                    const init = async () => {
                        const params = new URLSearchParams(window.location.search);
                        potId.value = params.get('potId');
                        shareToken.value = params.get('token');

                        if (!potId.value && !shareToken.value) {
                            nav.redirectToError({
                                type: 'not_found',
                            from: 'all-records',
                            redirect: '/',
                            message: '缺少花盆参数，无法加载养护记录。'
                        }, { replace: true });
                        return;
                    }

                        try {
                            if (shareToken.value) {
                                await loadPublicRecordsPage();
                            } else {
                                await Promise.all([
                                    loadPotInfo(),
                                    loadRecords()
                                ]);
                            }
                        } catch (e) {
                            console.error(e);
                            nav.redirectForApiError(e, {
                                from: 'all-records',
                                redirect: buildCurrentPageUrl(),
                                authType: 'login_required',
                            forbiddenType: 'forbidden',
                            notFoundType: 'not_found',
                            message: e.message || '养护记录暂时无法加载。'
                        }, { replace: true });
                    } finally {
                        isLoading.value = false;
                    }
                };

                const loadPotInfo = async () => {
                    const res = await apiClient.getPotDetail(potId.value);
                    if (res.success) pot.value = res.data;
                };

                    const loadRecords = async () => {
                        const res = await apiClient.getCareRecords(potId.value);
                        if (res.success) records.value = res.data || [];
                    };

                    const loadPublicRecordsPage = async () => {
                        const res = await apiClient.getPublicPotDetail(shareToken.value, {
                            careLimit: 'all',
                            timelineLimit: 1
                        });
                        if (res.success) {
                            const viewer = res.data.viewer || {};
                            pot.value = {
                                ...res.data.pot,
                                is_collaborator: !!viewer.isCollaborator,
                                is_viewer: !!viewer.isViewer
                            };
                            potId.value = pot.value?.id || potId.value;
                            records.value = res.data.careRecords || [];
                        }
                    };

                const normalizeCareType = MyFlowerPotsCare.normalizeCareType;

                const filteredRecords = computed(() => {
                    if (filterType.value === 'all') return records.value;
                    if (filterType.value === 'other') {
                        return records.value.filter(record => normalizeCareType(record.type, record.action) === 'custom');
                    }
                    return records.value.filter(record => normalizeCareType(record.type, record.action) === filterType.value);
                });
                const isArchived = computed(() => MyFlowerPotsPotPermissions.isArchivedPot(pot.value));
                const canManageRecords = computed(() =>
                    MyFlowerPotsPotPermissions.canManageRecords(pot.value, apiClient.userId)
                );

                const editRecord = (record) => {
                    if (!canManageRecords.value) return;
                    window.location.href = `care-record?id=${record.id}`;
                };

                const deleteRecord = async (record) => {
                    if (!canManageRecords.value) return;
                    if (!showConfirm('永久删除这条记录？')) return;
                    try {
                        const res = await apiClient.deleteCareRecord(record.id);
                        if (res.success) await loadRecords();
                    } catch (e) { showAlert('删除失败'); }
                };

                const imgUrl = MyFlowerPotsMedia.imgUrl;

                const previewImage = (url) => previewUrl.value = url;

                    const goBack = () => {
                        window.location.href = buildDetailPageUrl();
                    };

                const goAddCare = () => {
                    if (!canManageRecords.value) return;
                    window.location.href = `care-record?potId=${potId.value}`;
                };

                    window.addEventListener('auth:expired', (event) => {
                        nav.redirectToSessionExpired(event.detail?.message, {
                            from: 'all-records',
                            redirect: buildCurrentPageUrl(),
                            source: 'auth'
                    }, { replace: true });
                });

                const formatDate = MyFlowerPotsDate.formatZhDate;

                const getCareTypeIcon = MyFlowerPotsCare.getCareTypeIcon;
                const getCareTypeColor = MyFlowerPotsCare.getCareTypeColor;
                const getCareTypeLabel = MyFlowerPotsCare.getCareTypeLabel;

                onMounted(init);

                return {
                    isLoading, pot, isArchived, canManageRecords, filterType, filterOptions, filteredRecords, records, previewUrl,
                    editRecord, deleteRecord, previewImage, goBack, goAddCare, formatDate, imgUrl,
                    getCareTypeIcon, getCareTypeColor, getCareTypeLabel
                };
            }
        }).mount('#app');
    </script>

    <style>
        [v-cloak] {
            display: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</body>

</html>
