<body class="bg-gray-50 text-gray-900">
    <main class="min-h-screen">
        <header class="header">

        <section class="container py-8 sm:py-10">
            <article class="space-y-6">
                <section class="border-b border-gray-100 py-6">
                    <p class="text-xs font-black uppercase tracking-widest text-purple-600">Public Sharing</p>
                    <h1 class="mt-3 text-2xl font-black text-gray-900 sm:text-3xl">公开分享植物成长记录，主动开启才会生效。</h1>
                    <p class="mt-4 text-sm leading-7 text-gray-600">
                        当你想把一盆植物的状态发给朋友查看时，可以主动开启公开分享。分享页展示植物照片、养护记录和成长轨迹，关闭分享后原链接会失效。
                    </p>
                    <img src="assets/images/default-pot.png" alt="用于公开分享的植物花盆图片" class="mt-6 h-40 w-full rounded-lg object-cover sm:h-56">
                </section>

                <section class="border-b border-gray-100 py-6">
                    <h2 class="text-sm font-black text-gray-900">公开分享和协作邀请不同</h2>
                    <p class="mt-3 text-sm leading-7 text-gray-600">
                        公开分享适合让朋友查看一盆植物的状态；协作邀请适合让指定成员一起照料。两者的权限边界不同，使用时可以按目的选择。
                    </p>
                </section>

                <section class="border-b border-gray-100 py-6">
                    <h2 class="text-sm font-black text-gray-900">隐私边界</h2>
                    <p class="mt-3 text-sm leading-7 text-gray-600">
                        个人花盆和账号数据默认不公开。只有你主动开启公开分享的花盆才会生成查看链接，关闭后链接失效。第一阶段我们仍让具体花盆分享页保持不被搜索引擎索引。
                    </p>
                    <div class="mt-4 flex flex-wrap gap-3 text-xs font-bold">
                        <a href="/collaborative-plant-care" class="rounded-lg bg-green-50 px-3 py-2 text-green-700 hover:bg-green-100">了解协作照料</a>
                        <a href="/privacy" class="rounded-lg bg-gray-100 px-3 py-2 text-gray-700 hover:bg-gray-200">查看隐私说明</a>
                    </div>
                </section>
