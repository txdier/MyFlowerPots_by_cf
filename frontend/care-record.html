<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>养护记录 - My Flower Pots</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Vue 3 CDN -->
    <script src="js/vue.global.prod.js"></script>

    <style>
        [v-cloak] {
            display: none !important;
        }
    </style>

    <!-- Tailwind CSS & Custom Styles (Optimized) -->
    <link rel="stylesheet" href="css/tailwind-built.css?v=20260407-1">
    <link rel="stylesheet" href="css/app.css?v=20260429-auth-validation">

    <!-- 图标库 -->
    <link rel="stylesheet" href="css/icons.css">

    <!-- 配置脚本 -->
    <script src="js/config.js?v=20260111"></script>
    <script src="js/api-client.js?v=20260514-auth-refresh"></script>
    <script src="js/media-utils.js?v=20260507-image-cache"></script>
    <script src="js/ui-utils.js?v=20260421-refactor"></script>
    <script src="js/pot-permissions.js?v=20260421-refactor"></script>
    <script src="js/care-utils.js?v=20260421-refactor"></script>
    <script src="js/date-utils.js?v=20260428-growth"></script>
</head>

<body class="bg-gray-50">
    <div id="app" v-cloak>
        <!-- 顶部导航栏 (全宽强制布局) -->
        <header class="header bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-50 h-16 w-full">
            <div class="container relative flex items-center h-full">
                <div class="z-10">
                    <button class="inline-flex items-center justify-center text-gray-400 active:scale-90 transition"
                        @click="goBack">
                        <i class="fa fa-arrow-left text-xl"></i>
                    </button>
                </div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <h1 class="text-base sm:text-lg font-black text-gray-800">{{ isEditMode ? '修改养护记录' : '添加养护记录' }}
                    </h1>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main container py-6">
            <!-- 加载状态 -->
            <div v-if="isLoading" class="loading">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>

            <!-- 错误提示 -->
            <div v-if="error" class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative">
                <i class="fa fa-exclamation-triangle mr-2"></i>
                <span>{{ error }}</span>
            </div>

                <div v-if="!isLoading">
                <!-- 花盆信息展示 -->
                <div v-if="pot"
                    class="bg-white rounded-2xl p-4 mb-6 flex items-center shadow-sm border border-gray-100">
                    <img :src="imgUrl(pot.image_url, 64, 64) || 'assets/images/icons/icons-default-pot.png'"
                        class="w-16 h-16 rounded-xl object-cover mr-4">
                    <div>
                        <h3 class="font-bold text-gray-800">{{ pot.name }}</h3>
                        <p class="text-xs text-gray-400 mt-1">种植于 {{ formatDate(pot.plant_date) }}</p>
                    </div>
                </div>

                <!-- 表单区域 -->
                <div class="bg-white rounded-3xl shadow-sm p-6">
                    <form @submit.prevent="saveRecord">
                        <!-- 1. 养护日期 -->
                        <div class="mb-6">
                            <label class="block text-sm font-bold text-gray-700 mb-2">记录日期</label>
                            <input type="date" v-model="form.date" required
                                class="w-full bg-gray-50 border-gray-100 rounded-2xl py-3 px-4 focus:ring-green-500 focus:border-green-500 transition">
                        </div>

                        <!-- 2. 养护类型 (支持多选) -->
                        <div class="mb-6">
                            <label class="block text-sm font-bold text-gray-700 mb-1">养护类型</label>
                            <p class="text-[10px] text-gray-400 mb-3" v-if="!isEditMode">可同时选择多项，会自动带出当前植物提醒里的动态类型</p>
                            <div class="grid grid-cols-3 gap-3">
                                <button v-for="t in careTypes" :key="t.value" type="button"
                                    @click="toggleCareType(t.value)"
                                    :class="isTypeSelected(t.value) ? 'bg-green-500 text-white border-green-500 shadow-lg shadow-green-100 scale-[1.02]' : 'bg-gray-50 text-gray-500 border-gray-100 hover:bg-gray-100'"
                                    class="flex flex-col items-center justify-center py-4 rounded-2xl border transition-all duration-200">
                                    <i :class="t.icon" class="text-xl mb-2"></i>
                                    <span class="text-xs font-bold">{{ t.label }}</span>
                                    <span v-if="t.dynamic" class="mt-1 text-[9px] font-black tracking-wider opacity-70">动态</span>
                                </button>
                            </div>
                        </div>
                        <!-- 自定义内容输入 (仅当选择“其他”时显示) -->
                        <div v-if="shouldShowCustomActionInput" class="mb-6 animate-fade-in">
                            <label class="block text-sm font-bold text-gray-700 mb-2">自定义内容</label>
                            <input v-model="form.customAction" type="text" placeholder="比如：移动位置、清理枯叶..."
                                class="w-full bg-gray-50 border-gray-100 rounded-2xl py-3 px-4 focus:ring-green-500 focus:border-green-500 transition">
                        </div>

                        <!-- 3. 备注说明 -->
                        <div class="mb-8">
                            <label class="block text-sm font-bold text-gray-700 mb-2">备注说明</label>
                            <textarea v-model="form.description" rows="3" placeholder="记录今天做了什么，植物状态如何..."
                                class="w-full bg-gray-50 border-gray-100 rounded-2xl py-3 px-4 focus:ring-green-500 focus:border-green-500 transition resize-none"></textarea>
                        </div>

                        <!-- 4. 照片上传 (多选) -->
                        <div class="mb-8">
                            <label class="block text-sm font-bold text-gray-700 mb-2">现场照片 (可选)</label>

                            <!-- 图片网格 -->
                            <div class="grid grid-cols-4 gap-2 mb-2">
                                <!-- 已有的/新上传的图片预览 -->
                                <div v-for="(img, idx) in form.images" :key="idx"
                                    class="relative aspect-square bg-gray-100 rounded-xl overflow-hidden group border border-gray-100">
                                    <img :src="img.preview || img.url" class="w-full h-full object-cover">
                                    <!-- 删除按钮 -->
                                    <button @click.stop="removeImage(idx)" type="button"
                                        class="absolute top-1 right-1 bg-black/50 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition z-10">
                                        <i class="fa fa-times"></i>
                                    </button>
                                </div>

                                <!-- 添加按钮 -->
                                <button v-if="form.images.length < 9" @click="triggerFileInput" type="button"
                                    class="aspect-square border-2 border-dashed border-gray-200 rounded-xl flex flex-col items-center justify-center text-gray-300 hover:border-green-500 hover:text-green-500 transition active:scale-95 bg-gray-50/50">
                                    <i class="fa fa-camera text-xl mb-1"></i>
                                    <span class="text-[8px] font-black uppercase tracking-tighter">添加</span>
                                </button>
                            </div>

                            <input type="file" ref="fileInput" @change="onFilesSelected" multiple accept="image/*"
                                class="hidden">

                            <p class="text-xs text-gray-400">
                                <span class="text-green-500 bg-green-50 px-2 py-0.5 rounded-full inline-block text-[10px]">
                                    <i class="fa fa-magic mr-1"></i>会自动同步到生长轨迹
                                </span>
                            </p>
                        </div>

                        <!-- 提交按钮 -->
                        <div class="space-y-3">
                            <button type="submit" :disabled="isSaving || !canManageCareRecord"
                                class="w-full bg-green-500 text-white py-4 rounded-2xl text-lg font-bold shadow-lg shadow-green-100 hover:bg-green-600 transition active:scale-95 disabled:opacity-50">
                                <span v-if="!isSaving">{{ isEditMode ? '保存修改' : '确认添加' }}</span>
                                <span v-else><i class="fa fa-spinner fa-spin mr-2"></i>处理中...</span>
                            </button>
                            <button type="button" @click="goBack" class="w-full py-3 text-gray-400 font-bold text-sm">
                                取消并返回
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 页面提示 -->
            <div v-if="toast.show"
                class="fixed top-20 left-1/2 -translate-x-1/2 z-[100] px-4 py-3 rounded-2xl text-sm font-bold text-white shadow-xl transition-all duration-300"
                :class="toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'">
                <i class="fa mr-2" :class="toast.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'"></i>
                {{ toast.message }}
            </div>
        </main>
    </div>
    
    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;

        createApp({
            setup() {
                const nav = window.MyFlowerPotsNavigation;
                const isLoading = ref(true);
                const isSaving = ref(false);
                const error = ref(null);
                const pot = ref(null);
                const isArchived = computed(() => MyFlowerPotsPotPermissions.isArchivedPot(pot.value));
                const canManageCareRecord = computed(() =>
                    MyFlowerPotsPotPermissions.canManageRecords(pot.value, apiClient.userId)
                );
                const isEditMode = ref(false);
                const recordId = ref(null);
                const potId = ref(null);
                const toast = ref({ show: false, message: '', type: 'success' });

                const baseCareTypes = [
                    ...MyFlowerPotsCare.builtInCareTypes.map(({ value, label, icon }) => ({ value, label, icon })),
                    { value: 'other', label: '其他', icon: 'fa fa-ellipsis-h' }
                ];
                const builtInCareTypeValues = new Set(MyFlowerPotsCare.builtInCareTypes.map(item => item.value));
                const builtInCareTypeLabels = new Set(MyFlowerPotsCare.builtInCareTypes.map(item => item.label));
                const dynamicCareTypes = ref([]);
                const careTypes = computed(() => [...baseCareTypes, ...dynamicCareTypes.value]);

                const fileInput = ref(null);

                const form = reactive({
                    types: [],
                    date: new Date().toISOString().split('T')[0],
                    description: '',
                    customAction: '',
                    images: [] // { file?, preview?, url? }
                });
                const shouldShowCustomActionInput = computed(() => form.types.includes('other'));

                const canonicalCareType = (value) => {
                    const raw = String(value || '').trim().toLowerCase();
                    return MyFlowerPotsCare.normalizeCareType(raw, '', { keepUnknown: true });
                };

                const isBuiltInCareType = (value) => builtInCareTypeValues.has(canonicalCareType(value));

                const shortenCustomLabel = (value, maxLength = 10) => {
                    const normalized = String(value || '').trim();
                    if (!normalized) return '';
                    return normalized.length > maxLength ? `${normalized.slice(0, maxLength)}...` : normalized;
                };

                const upsertDynamicCareType = (option) => {
                    if (!option?.value || !option?.label) return;

                    const existingIndex = dynamicCareTypes.value.findIndex(item =>
                        item.value === option.value || item.label === option.label
                    );

                    if (existingIndex > -1) {
                        dynamicCareTypes.value[existingIndex] = {
                            ...dynamicCareTypes.value[existingIndex],
                            ...option,
                            dynamic: true
                        };
                        return;
                    }

                    dynamicCareTypes.value.push({
                        ...option,
                        dynamic: true
                    });
                };

                const ensureRecordCareTypeOption = (recordData) => {
                    const recordType = String(recordData?.type || '').trim();
                    if (!recordType || recordType === 'other' || isBuiltInCareType(recordType)) return;

                    upsertDynamicCareType({
                        value: recordType,
                        label: String(recordData?.action || recordType).trim() || recordType,
                        icon: 'fa fa-clipboard-check'
                    });
                };

                const loadCareTypeOptions = async (pid, recordData = null) => {
                    dynamicCareTypes.value = [];
                    if (!pid) {
                        ensureRecordCareTypeOption(recordData);
                        return;
                    }

                    try {
                        const res = await apiClient.getCareSchedules(pid);
                        if (res.success && Array.isArray(res.data)) {
                            res.data.forEach((schedule) => {
                                const rawType = canonicalCareType(schedule.care_type);
                                if (rawType && rawType !== 'other' && builtInCareTypeValues.has(rawType)) {
                                    return;
                                }

                                const dynamicLabel = String(schedule.custom_action || schedule.care_type || '').trim();
                                if (!dynamicLabel || builtInCareTypeLabels.has(dynamicLabel)) {
                                    return;
                                }

                                upsertDynamicCareType({
                                    value: dynamicLabel,
                                    label: dynamicLabel,
                                    icon: 'fa fa-clipboard-check'
                                });
                            });
                        }
                    } catch (err) {
                        console.warn('加载动态养护类型失败:', err);
                    }

                    ensureRecordCareTypeOption(recordData);
                };

                const getCareTypeOption = (value) => careTypes.value.find(item => item.value === value);

                const showToast = MyFlowerPotsUi.createToast(toast);

                const init = async () => {
                    const params = new URLSearchParams(window.location.search);
                    recordId.value = params.get('id');
                    potId.value = params.get('potId');

                    try {
                        if (recordId.value) {
                            isEditMode.value = true;
                            await loadRecordDetail();
                        } else if (potId.value) {
                            await loadPotInfo(potId.value);
                            await loadCareTypeOptions(potId.value);
                        } else {
                            nav.redirectToError({
                                type: 'not_found',
                                from: 'care-record',
                                redirect: '/',
                                message: '缺少花盆参数，无法填写养护记录。'
                            }, { replace: true });
                            return;
                        }
                    } catch (err) {
                        if (['auth', 'forbidden', 'not_found'].includes(nav.classifyApiError(err))) {
                            const redirect = recordId.value
                                ? `care-record?id=${encodeURIComponent(recordId.value)}`
                                : `care-record?potId=${encodeURIComponent(potId.value || '')}`;
                            nav.redirectForApiError(err, {
                                from: 'care-record',
                                redirect,
                                authType: 'login_required',
                                forbiddenType: 'forbidden',
                                notFoundType: 'not_found',
                                message: err.message || '养护记录暂时无法加载。'
                            }, { replace: true });
                            return;
                        }
                        error.value = '加载数据失败';
                    } finally {
                        isLoading.value = false;
                    }
                };

                const loadRecordDetail = async () => {
                    const res = await apiClient.getCareRecordDetail(recordId.value);
                    if (res.success) {
                        const data = res.data;
                        form.types = [isBuiltInCareType(data.type) ? canonicalCareType(data.type) : data.type];
                        form.date = data.date;
                        form.description = data.description || '';
                        form.customAction = data.type === 'other' ? (data.action || data.description || '') : '';

                        form.images = MyFlowerPotsMedia.parseImageList(data.imageUrl).map(url => ({ url }));

                        potId.value = data.potId;
                        await loadPotInfo(data.potId);
                        await loadCareTypeOptions(data.potId, data);
                    }
                };

                const loadPotInfo = async (pid) => {
                    const res = await apiClient.getPotDetail(pid);
                    if (res.success) {
                        pot.value = res.data;
                        if (!canManageCareRecord.value) {
                            showToast(isArchived.value
                                ? '已归档植物为只读状态，不能新增或修改养护记录。'
                                : '仅查看权限不能新增或修改养护记录。', 'error');
                            setTimeout(() => {
                                window.location.href = `pot-detail?id=${pid}`;
                            }, 700);
                        }
                    }
                };

                const toggleCareType = (val) => {
                    if (isEditMode.value) {
                        form.types = [val];
                        return;
                    }
                    const idx = form.types.indexOf(val);
                    if (idx > -1) {
                        if (form.types.length > 1) form.types.splice(idx, 1);
                    } else {
                        form.types.push(val);
                    }
                };

                const isTypeSelected = (val) => form.types.includes(val);

                const triggerFileInput = () => fileInput.value.click();

                const onFilesSelected = async (e) => {
                    const remaining = 9 - form.images.length;
                    const items = await MyFlowerPotsMedia.selectImages(e, { limit: remaining });
                    form.images.push(...items);
                };

                const removeImage = (idx) => {
                    form.images.splice(idx, 1);
                };

                const saveRecord = async () => {
                    if (!canManageCareRecord.value) {
                        showToast(isArchived.value
                            ? '已归档植物为只读状态，不能保存养护记录。'
                            : '仅查看权限不能保存养护记录。', 'error');
                        return;
                    }
                    if (form.types.length === 0) {
                        showToast('请至少选择一种养护类型', 'error');
                        return;
                    }

                    try {
                        isSaving.value = true;

                        // 1. 上传新图片
                        const uploadedUrls = [];

                        // 先保留已有图片URL
                        form.images.forEach(img => {
                            if (img.url) uploadedUrls.push(img.url);
                        });

                        // 上传新文件
                        const newImages = form.images.filter(img => img.file);
                        uploadedUrls.push(...await MyFlowerPotsMedia.uploadImages(apiClient, newImages, {
                            potId: potId.value,
                            uploadType: 'care'
                        }));

                        const selectedCareTypes = form.types.map((typeValue) => {
                            if (typeValue === 'other') {
                                const customLabel = shortenCustomLabel(form.customAction);
                                return {
                                    type: 'other',
                                    action: customLabel || '其他'
                                };
                            }

                            const option = getCareTypeOption(typeValue);
                            const normalizedType = canonicalCareType(typeValue);
                            if (option?.dynamic) {
                                return {
                                    type: option.value,
                                    action: option.label
                                };
                            }

                            return {
                                type: builtInCareTypeValues.has(normalizedType) ? normalizedType : typeValue,
                                action: option?.label || typeValue
                            };
                        });

                        const payload = {
                            potId: potId.value,
                            types: selectedCareTypes.map(item => item.type),
                            actions: selectedCareTypes.map(item => item.action),
                            careDate: form.date,
                            description: form.description,
                            imageUrls: uploadedUrls // 发送数组
                        };

                        let result;
                        if (isEditMode.value) {
                            const editPayload = {
                                ...payload,
                                type: selectedCareTypes[0].type,
                                action: selectedCareTypes[0].action
                            };
                            result = await apiClient.updateCareRecord(recordId.value, editPayload);
                        } else {
                            result = await apiClient.createCareRecord(payload);
                        }

                        if (result.success) {
                            showToast('保存成功');
                            setTimeout(() => {
                                window.location.href = `pot-detail?id=${potId.value}`;
                            }, 500);
                        }
                    } catch (err) {
                        console.error('保存失败:', err);
                        if (['auth', 'forbidden', 'not_found'].includes(nav.classifyApiError(err))) {
                            const redirect = recordId.value
                                ? `care-record?id=${encodeURIComponent(recordId.value)}`
                                : `care-record?potId=${encodeURIComponent(potId.value || '')}`;
                            nav.redirectForApiError(err, {
                                from: 'care-record',
                                redirect,
                                authType: 'session_expired',
                                forbiddenType: 'forbidden',
                                notFoundType: 'not_found',
                                message: err.message || '当前养护记录暂时无法继续保存。'
                            }, { replace: true });
                            return;
                        }
                        showToast(`保存失败: ${err.message || '未知错误'}`, 'error');
                    } finally {
                        isSaving.value = false;
                    }
                };

                const goBack = () => {
                    window.location.href = `pot-detail?id=${potId.value}`;
                };

                const imgUrl = MyFlowerPotsMedia.imgUrl;

                const formatDate = MyFlowerPotsDate.formatIsoDate;

                window.addEventListener('auth:expired', (event) => {
                    const redirect = recordId.value
                        ? `care-record?id=${encodeURIComponent(recordId.value)}`
                        : `care-record?potId=${encodeURIComponent(potId.value || '')}`;
                    nav.redirectToSessionExpired(event.detail?.message, {
                        from: 'care-record',
                        redirect,
                        source: 'auth'
                    }, { replace: true });
                });

                onMounted(init);

                return {
                    isLoading, isSaving, error, pot, isArchived, canManageCareRecord, isEditMode, careTypes, form, fileInput, toast,
                    toggleCareType, isTypeSelected,
                    triggerFileInput, onFilesSelected, removeImage, saveRecord, goBack, formatDate, imgUrl,
                    potId, shouldShowCustomActionInput
                };
            }
        }).mount('#app');
    </script>

    <style>
        .header h1 {
            font-weight: 800;
            color: #1a1a1a;
        }

    </style>
</body>

</html>
