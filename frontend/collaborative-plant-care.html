<body class="bg-gray-50 text-gray-900">
    <main class="min-h-screen">
        <header class="header">
            <div class="container">
                <a href="/" class="inline-flex items-center gap-2 text-sm font-black text-gray-800">
                    <img src="assets/images/icons/pots-192.png" alt="我的花盆图标" class="h-8 w-8 rounded-lg">
                    <span>我的花盆</span>
                </a>
                <nav class="flex items-center gap-4 text-xs font-bold text-gray-500">
                    <a href="/public-plant-sharing" class="hover:text-green-600">公开分享</a>
                    <a href="/privacy" class="hover:text-green-600">隐私</a>
                    <a href="/" class="text-green-600 hover:text-green-700">打开应用</a>
                </nav>
            </div>
        </header>

        <section class="container py-8 sm:py-10">
            <article class="space-y-6">
                <section class="border-b border-gray-100 py-6">
                    <p class="text-xs font-black uppercase tracking-widest text-amber-600">Collaborative Care</p>
                    <h1 class="mt-3 text-2xl font-black text-gray-900 sm:text-3xl">多人协作照料，让植物不因分工模糊被忘记。</h1>
                    <p class="mt-4 text-sm leading-7 text-gray-600">
                        家庭阳台、办公室绿植、朋友代养的植物，经常需要多人查看或记录。我的花盆支持把花盆分享给指定成员，让照料动作和状态变得清楚。
                    </p>
                    <img src="assets/images/flowerpot.png" alt="适合多人协作照料的花盆插图" class="mt-6 h-40 w-full rounded-lg object-contain bg-white sm:h-56">
                </section>

                <section class="border-b border-gray-100 py-6">
                    <h2 class="text-sm font-black text-gray-900">查看者和协作者分开</h2>
                    <p class="mt-3 text-sm leading-7 text-gray-600">
                        有些人只需要查看植物状态，有些人需要共同记录养护。把不同角色分开，可以减少误操作，也能让共同照料更明确。
                    </p>
                </section>

                <section class="border-b border-gray-100 py-6">
                    <h2 class="text-sm font-black text-gray-900">适合的使用方式</h2>
                    <div class="mt-4 space-y-3 text-sm leading-7 text-gray-600">
                        <p><span class="font-black text-gray-800">办公室：</span>同事轮流浇水时，可以查看上次照料时间。</p>
                        <p><span class="font-black text-gray-800">家庭：</span>家人共同照料阳台植物，减少重复浇水。</p>
                        <p><span class="font-black text-gray-800">代养：</span>临时请朋友照看植物时，保留清楚的养护记录。</p>
                    </div>
                    <div class="mt-4 flex flex-wrap gap-3 text-xs font-bold">
                        <a href="/plant-care-records" class="rounded-lg bg-green-50 px-3 py-2 text-green-700 hover:bg-green-100">查看养护记录</a>
                        <a href="/privacy" class="rounded-lg bg-gray-100 px-3 py-2 text-gray-700 hover:bg-gray-200">了解隐私边界</a>
                    </div>
                </section>
            </article>
        </section>
    </main>
