<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>重置密码 - My Flower Pots</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Tailwind CSS & Custom Styles (Optimized) -->
    <link rel="stylesheet" href="css/tailwind-built.css?v=20260227">
    <link rel="stylesheet" href="css/app.css?v=20260429-auth-validation">

    <script src="js/vue.global.js"></script>
    <link rel="stylesheet" href="css/icons.css">
    <script src="js/config.js?v=20260429-turnstile"></script>
    <script src="js/api-client.js?v=20260429-turnstile"></script>
    <script src="js/form-utils.js?v=20260505-auth-keyboard"></script>
    <style>
        [v-cloak] {
            display: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* 密码管理器自动填充检测 */
        @keyframes resetAutofillDetect {
            from { opacity: 1; }
            to   { opacity: 1; }
        }
        input:-webkit-autofill {
            animation-name: resetAutofillDetect;
            animation-duration: 0.001s;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div id="app" v-cloak>
        <header class="header bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-50 h-16 w-full">
            <div class="container relative flex items-center h-full">
                <div class="z-10">
                    <a href="/"
                        class="inline-flex items-center justify-center text-gray-400 active:scale-90 transition">
                        <i class="fa fa-arrow-left text-xl"></i>
                    </a>
                </div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <h1 class="text-base sm:text-lg font-black text-gray-800">重置密码</h1>
                </div>
            </div>
        </header>

        <main class="container py-12 flex justify-center items-center flex-1">
            <div class="w-full">
                <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl shadow-green-100/50 text-center">
                    <div
                        class="w-20 h-20 bg-green-50 text-green-500 rounded-3xl flex items-center justify-center text-3xl mx-auto mb-6">
                        <i class="fa fa-key"></i>
                    </div>

                    <h1 class="text-3xl font-black text-gray-800 mb-2">重置您的密码</h1>
                    <p class="text-gray-400 text-sm mb-8">请设置您的新密码，确保它足够安全</p>

                    <div v-if="!token" class="bg-red-50 text-red-500 p-4 rounded-2xl text-sm mb-6">
                        <i class="fa fa-exclamation-circle mr-2"></i>
                        无效或已过期的重置链接。
                        <div class="mt-4">
                            <a href="/" class="text-red-600 font-bold underline">返回主页</a>
                        </div>
                    </div>

                    <form v-else @submit.prevent="handleSubmit" class="space-y-4">
                        <div class="relative text-left space-y-1.5">
                            <label class="text-xs font-bold text-gray-400 ml-4 mb-1 block">新密码</label>
                            <input id="resetPassword" type="password" v-model="form.password"
                                autocomplete="new-password" minlength="8" @input="handlePasswordInput"
                                @blur="validatePassword(true)" @animationstart="syncResetFormFromDom"
                                placeholder="至少 8 位，含字母和数字" required :aria-invalid="errors.password ? 'true' : 'false'"
                                class="w-full bg-gray-50 border rounded-2xl py-4 px-6 focus:ring-2 transition-all outline-none"
                                :class="errors.password ? 'border-red-200 focus:ring-red-200' : 'border-transparent focus:ring-green-500'">
                            <p v-if="errors.password" class="text-red-500 text-xs px-4">{{ errors.password }}</p>
                        </div>

                        <div class="relative text-left space-y-1.5">
                            <label class="text-xs font-bold text-gray-400 ml-4 mb-1 block">确认新密码</label>
                            <input id="resetConfirmPassword" type="password" v-model="form.confirmPassword"
                                autocomplete="new-password" minlength="8" @input="handleConfirmPasswordInput"
                                @blur="validateConfirmPassword(true)" @animationstart="syncResetFormFromDom"
                                placeholder="再次输入新密码" required :aria-invalid="errors.confirmPassword ? 'true' : 'false'"
                                class="w-full bg-gray-50 border rounded-2xl py-4 px-6 focus:ring-2 transition-all outline-none"
                                :class="errors.confirmPassword ? 'border-red-200 focus:ring-red-200' : 'border-transparent focus:ring-green-500'">
                            <div v-if="form.password && form.confirmPassword" class="absolute right-4 bottom-4">
                                <i v-if="passwordsMatch" class="fa fa-check text-green-500"></i>
                                <i v-else class="fa fa-times text-red-500"></i>
                            </div>
                            <p v-if="errors.confirmPassword" class="text-red-500 text-xs px-4">{{ errors.confirmPassword }}</p>
                        </div>

                        <div v-if="status.message" class="rounded-2xl px-4 py-3 text-xs text-left"
                            :class="status.type === 'error' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'">
                            <i class="fa mr-1"
                                :class="status.type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'"></i>
                            {{ status.message }}
                        </div>

                        <button type="submit" :disabled="isLoading || !isFormValid"
                            class="w-full btn-primary py-5 rounded-[1.5rem] text-lg font-black mt-4 shadow-xl shadow-green-200 disabled:opacity-50 disabled:shadow-none">
                            <span v-if="isLoading">
                                <i class="fa fa-circle-notch fa-spin mr-2"></i>处理中...
                            </span>
                            <span v-else>保存新密码</span>
                        </button>
                    </form>

                    <div class="mt-8 pt-6 border-t border-gray-100">
                        <a href="/?open=login&auto=1" @pointerdown.prevent @click.prevent="goToLogin"
                            class="text-gray-400 hover:text-green-500 text-sm font-bold transition">想起账号了？直接登录</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const formUtils = window.MyFlowerPotsFormUtils;
                const token = ref(new URLSearchParams(window.location.search).get('token'));
                const isLoading = ref(false);
                const form = reactive({
                    password: '',
                    confirmPassword: ''
                });
                const errors = reactive({
                    password: '',
                    confirmPassword: ''
                });
                const status = reactive({
                    type: '',
                    message: ''
                });

                const passwordsMatch = computed(() =>
                    !!form.password &&
                    !!form.confirmPassword &&
                    form.password === form.confirmPassword
                );

                const isFormValid = computed(() =>
                    formUtils.isValidPassword(form.password) &&
                    !!form.confirmPassword &&
                    passwordsMatch.value
                );

                const clearStatus = () => {
                    status.type = '';
                    status.message = '';
                };

                const syncResetFormFromDom = () => {
                    formUtils.syncFormFieldsFromDom([
                        { elementId: 'resetPassword', form, key: 'password' },
                        { elementId: 'resetConfirmPassword', form, key: 'confirmPassword' }
                    ]);
                };

                const validatePassword = (showRequired = false) => {
                    errors.password = formUtils.getPasswordError(form.password, {
                        required: showRequired,
                        requiredMessage: '请输入新密码',
                        tooShortMessage: '密码至少 8 位'
                    });
                    return !errors.password;
                };

                const validateConfirmPassword = (showRequired = false) => {
                    if (!form.confirmPassword) {
                        errors.confirmPassword = showRequired ? '请再次输入新密码' : '';
                        return !errors.confirmPassword;
                    }
                    errors.confirmPassword = passwordsMatch.value ? '' : '两次输入的密码不一致';
                    return !errors.confirmPassword;
                };

                const handlePasswordInput = () => {
                    clearStatus();
                    validatePassword(false);
                    if (form.confirmPassword) {
                        validateConfirmPassword(false);
                    } else {
                        errors.confirmPassword = '';
                    }
                };

                const handleConfirmPasswordInput = () => {
                    clearStatus();
                    validateConfirmPassword(false);
                };

                const focusFieldById = (elementId) => formUtils.focusFieldById(elementId, nextTick);

                const scheduleResetAutofillSync = async () => {
                    await nextTick();
                    [80, 250, 800, 1600].forEach(delay => window.setTimeout(syncResetFormFromDom, delay));
                };

                const goToLogin = (options = {}) => {
                    window.apiClient?.clearAuth?.();
                    window.authStorage?.clear?.();

                    const loginUrl = new URL('/', window.location.origin);
                    loginUrl.searchParams.set('open', 'login');
                    loginUrl.searchParams.set('auto', '1');
                    if (options.notice) {
                        loginUrl.searchParams.set('notice', options.notice);
                    }
                    window.location.href = loginUrl.pathname + loginUrl.search;
                };

                const handleSubmit = async () => {
                    syncResetFormFromDom();
                    clearStatus();

                    if (!validatePassword(true)) {
                        await focusFieldById('resetPassword');
                        return;
                    }
                    if (!validateConfirmPassword(true)) {
                        await focusFieldById('resetConfirmPassword');
                        return;
                    }

                    try {
                        isLoading.value = true;
                        const res = await apiClient.resetPassword(token.value, form.password);

                        if (res.success) {
                            status.type = 'success';
                            status.message = '密码重置成功，正在返回登录页。';
                            window.setTimeout(() => {
                                goToLogin({ notice: 'password_reset_success' });
                            }, 900);
                        }
                    } catch (e) {
                        status.type = 'error';
                        status.message = '重置失败: ' + e.message;
                    } finally {
                        isLoading.value = false;
                    }
                };

                onMounted(() => {
                    scheduleResetAutofillSync();
                });

                return {
                    token, form, errors, status, isLoading, passwordsMatch, isFormValid,
                    syncResetFormFromDom, validatePassword, validateConfirmPassword,
                    handlePasswordInput, handleConfirmPasswordInput, handleSubmit, goToLogin
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
